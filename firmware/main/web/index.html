<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32-C5_13-6CM_pdx-datv-beacon</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#f0b429;--red:#e5534b;--blue:#539bf5;--grn:#57ab5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;letter-spacing:.2px;overflow-wrap:anywhere;min-width:0}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.lang{float:right}
.lang button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 8px;margin-left:4px;font-size:13px}
.lang button.on{border-color:var(--acc);color:var(--acc)}
main{padding:12px 16px 90px;max-width:640px;margin:0 auto}
.state{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.state small{display:block;color:var(--mut);font-weight:400}
html,body{overflow-x:hidden}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:8px 12px 12px;background:var(--card);min-width:0}
legend{color:var(--acc);font-weight:600;padding:0 6px}
.band13 legend{color:var(--red)}.band6 legend{color:var(--blue)}
label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
label span{flex:1;color:var(--fg)}
input,select{background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:15px;width:52%;min-width:0;flex:none}
label span{min-width:0}
input[type=checkbox]{width:22px;height:22px}
input[type=range]{width:52%}
.hint{color:var(--mut);font-size:12px;margin:-4px 0 6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#010409;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{flex:1 1 30%;min-width:96px;border:0;border-radius:8px;padding:11px 6px;font-weight:700;font-size:14px;color:#0d1117;background:var(--acc)}
.bar .start{background:var(--grn)}.bar .stop{background:var(--red);color:#fff}.bar .sec{background:#30363d;color:var(--fg)}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:var(--grn);color:#0d1117;font-weight:700;font-size:18px;text-align:center;padding:18px 26px;border-radius:12px;display:none;width:max-content;max-width:86%;box-shadow:0 0 0 100vmax #0006,0 6px 24px #000a}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px;color:var(--mut);font-size:13px}.calc span{flex:1 1 100%}
.calc input{width:30%}.calc select{width:28%}.calc button{flex:1;border:0;border-radius:6px;padding:8px;font-weight:700;background:#30363d;color:var(--fg)}
ol.how{margin:6px 0 0;padding-left:20px}ol.how li{margin:0 0 8px}ol.how b{color:var(--acc)}
#msg.bad{background:var(--red);color:#fff}
.bar button.flash{animation:fl .7s}@keyframes fl{0%{background:#fff}100%{}}
#cyc{width:100%;height:auto;display:block;margin-top:4px}
.cyctxt{color:var(--mut);font-size:12px;margin-top:6px}
table.pins{width:100%;border-collapse:collapse;font-size:14px}table.pins td{border-bottom:1px solid var(--line);padding:6px 4px}
table.pins td:last-child{text-align:right;font-weight:600}.pins .r{color:var(--red)}.pins .b{color:var(--blue)}.pins .y{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="lang"><button data-l="it">IT</button><button data-l="en">EN</button><button data-l="ja">日本語</button></div>
  <h1>ESP32-C5_13-6CM_pdx-datv-beacon</h1>
  <div class="sub" id="fw">13 / 6 cm DVB-S2</div>
</header>
<main>
  <div class="state"><span id="st">…</span><small data-t="st_hint"></small></div>

  <fieldset><legend data-t="g_chart"></legend>
    <svg id="cyc" viewBox="0 0 600 120" role="img"></svg>
    <div class="cyctxt" id="cyctxt"></div>
  </fieldset>

  <fieldset><legend data-t="g_station"></legend>
    <label><span data-t="call"></span><input id="call" maxlength="15"></label>
    <label><span data-t="appass"></span><input id="appass" maxlength="15"></label>
    <div class="hint" data-t="appass_h"></div>
  </fieldset>

  <fieldset class="band13"><legend data-t="g_13"></legend>
    <label><span data-t="on"></span><input type="checkbox" id="b13"></label>
    <label><span data-t="freq"></span><input id="f13" inputmode="decimal"></label>
    <label><span data-t="ant"></span><select id="ant13"><option value="1">IPEX</option><option value="0" data-t="pcb"></option></select></label>
    <label><span data-t="gpio"></span><select id="gpio13" class="gp"></select></label>
  </fieldset>

  <fieldset class="band6"><legend data-t="g_6"></legend>
    <label><span data-t="on"></span><input type="checkbox" id="b6"></label>
    <label><span data-t="freq"></span><input id="f6" inputmode="decimal"></label>
    <label><span data-t="ant"></span><select id="ant6"><option value="1">IPEX</option><option value="0" data-t="pcb"></option></select></label>
    <label><span data-t="gpio"></span><select id="gpio6" class="gp"></select></label>
  </fieldset>

  <fieldset><legend data-t="g_tx"></legend>
    <label><span data-t="sr"></span><select id="sr"><option value="125000">125 kS</option><option value="250000">250 kS</option><option value="333000">333 kS</option><option value="500000">500 kS</option><option value="1000000" data-t="sr1000" disabled></option></select></label>
    <label><span><span data-t="amp"></span> <b id="ampv"></b></span><input type="range" id="amp" min="20" max="300" step="5"></label>
    <label><span data-t="ppm"></span><input id="ppm" inputmode="decimal"></label>
    <div class="hint" id="ppmh"></div>
    <div class="calc"><span data-t="calc"></span>
      <input id="offk" inputmode="decimal" placeholder="+20.5"><select id="offb"><option value="13">13 cm</option><option value="6">6 cm</option></select><button id="calc" type="button" data-t="calc_b"></button></div>
    <label><span data-t="gpioptt"></span><select id="gpioptt" class="gp"></select></label>
    <label><span data-t="gpiostop"></span><select id="gpiostop" class="gp"></select></label>
    <div class="hint" data-t="gpiostop_h"></div>
    <label><span data-t="gpiopol"></span><select id="gpiopol"><option value="1" data-t="high"></option><option value="0" data-t="low"></option></select></label>
  </fieldset>

  <fieldset><legend data-t="g_pins"></legend>
    <table class="pins" id="pins"></table>
  </fieldset>

  <fieldset><legend data-t="g_cycle"></legend>
    <label><span data-t="tx"></span><input id="tx" type="number" min="10" max="600"></label>
    <label><span data-t="pause"></span><input id="pause" type="number" min="5" max="3600"></label>
    <label><span data-t="wait"></span><input id="wait" type="number" min="5" max="300"></label>
    <label><span data-t="auto"></span><input type="checkbox" id="auto"></label>
    <div class="hint" data-t="stop_h"></div>
  </fieldset>

  <fieldset><legend data-t="g_how"></legend>
    <ol class="how" id="how"></ol>
  </fieldset>
</main>
<div id="msg"></div>
<div class="bar">
  <button id="apply" data-t="apply"></button>
  <button id="save" data-t="save"></button>
  <button id="defs" class="sec" data-t="defaults"></button>
  <button id="start" class="start" data-t="start"></button>
  <button id="stop" class="stop" data-t="stop"></button>
</div>

 stop_h:"Per fermare il beacon senza tasti vedi le istruzioni qui sotto.",g_how:"Fermare il beacon senza tasti",
 how:["<b>Doppia accensione</b>: accendi, togli l'alimentazione entro 5 s e riaccendi. La scheda parte in configurazione: nessuna TX, LED giallo fisso, Wi-Fi acceso.",
  "<b>GPIO STOP</b>: porta il {G} a massa (GND) con un interruttore, un relè o un ricevitore di telecomando. In TX il beacon si ferma subito e si riavvia in configurazione con il Wi-Fi acceso; nell'attesa e nelle pause ferma il ciclo; tenuto a massa all'accensione impedisce ogni TX. Per ripartire: lascialo libero e premi START.",

function lang(l){L=l;try{localStorage.setItem("lang",l)}catch(e){}document.documentElement.lang=l;

function msg(t,bad){const m=$("msg");m.textContent=t;m.className=bad?"bad":"";m.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display="none",bad?4000:1600)}

function pins(){const ant=v=>v=="1"?"IPEX":T[L].pcb;
 const rows=[["r",T[L].p13+" ("+ant($("ant13").value)+")",gname($("gpio13").value)],["b",T[L].p6+" ("+ant($("ant6").value)+")",gname($("gpio6").value)],

 $("pins").innerHTML=rows.map(r=>`<tr><td class="${r[0]}">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
function chart(){const b13=$("b13").checked,b6=$("b6").checked,tx=+$("tx").value||0,pa=+$("pause").value||0,wa=+$("wait").value||0;
 const seg=[];if(b13){seg.push(["#e5534b","13 cm",tx]);seg.push(["#f0b429",T[L].pause_t,pa])}if(b6){seg.push(["#539bf5","6 cm",tx]);seg.push(["#f0b429",T[L].pause_t,pa])}
 const tot=seg.reduce((a,x)=>a+x[2],0)||1,txs=(b13?tx:0)+(b6?tx:0);let x=10,h="";
 const W=580;h+=`<text x="10" y="16" fill="#8b949e" font-size="13">${T[L].wait_t} ${wa} s → </text>`;
 seg.forEach(s=>{const w=Math.max(2,W*s[2]/tot);h+=`<rect x="${x}" y="28" width="${w-2}" height="46" rx="5" fill="${s[0]}"/>`;
  if(w>44)h+=`<text x="${x+w/2-1}" y="49" fill="#0d1117" font-size="13" font-weight="700" text-anchor="middle">${s[1]}</text><text x="${x+w/2-1}" y="66" fill="#0d1117" font-size="12" text-anchor="middle">${s[2]} s</text>`;x+=w});
 h+=`<text x="10" y="100" fill="#8b949e" font-size="13">${T[L].cyc_tot} ${tot} s · ${T[L].cyc_tx} ${(100*txs/tot).toFixed(0)}% · ${T[L].pause_t} ${(100*(tot-txs)/tot).toFixed(0)}% → ↻</text>`;
 $("cyc").innerHTML=h;$("cyctxt").textContent=""}

 $("how").innerHTML=T[L].how.map(x=>"<li>"+x.replace("{G}","<b>"+G+"</b>").replace("{P}",P)+"</li>").join("")}
function stline(s){$("st").textContent=s.state+(s.stopnow?T[L].stopnow:"")}
function pll(f){const p=parseFloat($("ppm").value)||0;return Math.round(parseFloat(f)*1000/(1+p*1e-6)).toLocaleString("it-IT")}

function sgn(x){return (x>=0?"+":"")+x.toFixed(2)}
function redraw(){chart();pins();how();ppmh()}
function db(a){return (20*Math.log10(a/480)).toFixed(1)+" dB"}
function fill(s){$("fw").textContent=s.fw+" · 13 / 6 cm DVB-S2";stline(s);
 ["call","appass","tx","pause","wait"].forEach(k=>$(k).value=s[k]);
 $("f13").value=(s.f13/1000).toFixed(3);$("f6").value=(s.f6/1000).toFixed(3);$("sr").value=s.sr;$("amp").value=s.amp;$("ampv").textContent=db(s.amp);
 $("b13").checked=!!(s.bands&1);$("b6").checked=!!(s.bands&2);$("auto").checked=!!s.auto;
 ["ant13","ant6","gpio13","gpio6","gpiopol","gpioptt","gpiostop"].forEach(k=>$(k).value=s[k]);$("ppm").value=sgn((s.ppm||0)/100);redraw()}
function form(){const b=($("b13").checked?1:0)|($("b6").checked?2:0);
 const f={call:$("call").value,appass:$("appass").value,f13:$("f13").value,f6:$("f6").value,sr:$("sr").value,amp:$("amp").value,
 tx:$("tx").value,pause:$("pause").value,wait:$("wait").value,bands:b,auto:$("auto").checked?1:0,ant13:$("ant13").value,ant6:$("ant6").value,
 gpio13:$("gpio13").value,gpio6:$("gpio6").value,gpiopol:$("gpiopol").value,gpioptt:$("gpioptt").value,gpiostop:$("gpiostop").value,ppm:(parseFloat($("ppm").value)||0).toFixed(2)};
 return Object.entries(f).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&")}
async function api(p,body){const r=await fetch(p,{method:body===undefined?"GET":"POST",body:body,headers:{"Content-Type":"application/x-www-form-urlencoded"}});
 const j=await r.json();if(!r.ok)throw new Error(j.err||r.status);return j}
async function load(){try{fill(await api("/api/status"))}catch(e){}}
$("amp").oninput=()=>$("ampv").textContent=db($("amp").value);
$("apply").onclick=async()=>{flash("apply");try{fill(await api("/api/set",form()));msg(T[L].applied)}catch(e){msg(T[L].err+e.message,1)}};
$("save").onclick=async()=>{flash("save");try{await api("/api/set",form());fill(await api("/api/save",""));msg(T[L].saved)}catch(e){msg(T[L].err+e.message,1)}};
$("defs").onclick=async()=>{try{fill(await api("/api/defaults",""))}catch(e){msg(T[L].err+e.message)}};
$("stop").onclick=async()=>{try{fill(await api("/api/stop",""));msg(T[L].ok)}catch(e){msg(T[L].err+e.message)}};
$("start").onclick=async()=>{try{await api("/api/start","");msg(T[L].starting)}catch(e){msg(T[L].err+e.message)}};
$("calc").onclick=()=>{const o=parseFloat(String($("offk").value).replace(",","."));const f=parseFloat($($("offb").value=="13"?"f13":"f6").value);
 if(isNaN(o)||!f){msg(T[L].err+"kHz",1);return}
 const p=(parseFloat($("ppm").value)||0)+o*1000/f;$("ppm").value=sgn(Math.max(-100,Math.min(100,p)));$("offk").value="";redraw();msg(T[L].calcd)};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang(b.dataset.l);redraw()});
["b13","b6","tx","pause","wait","ant13","ant6","gpio13","gpio6","gpioptt","gpiostop","appass","ppm","f13","f6"].forEach(k=>{$(k).addEventListener("input",redraw);$(k).addEventListener("change",redraw)});
lang(L);redraw();load();setInterval(async()=>{try{stline(await api("/api/status"))}catch(e){}},3000);
</script>
</body>
</html>
